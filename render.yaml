services:
  - type: web
    name: careerlens-resume-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    plan: starter
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_PATH
        value: /opt/render/project/src/instance/resume_analyzer.sqlite3
      - key: FLASK_SECRET_KEY
        generateValue: true
    disk:
      name: careerlens-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
